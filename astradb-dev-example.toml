# AstraDB development configuration example
#
# Copy this file to astradb-dev.toml for local development. It keeps the same
# unified schema as astradb.toml, but with louder logging and smaller memory
# limits for quick iteration.

[server]
host = "0.0.0.0"
port = 6379
max_connections = 10000
thread_count = 2
use_per_worker_io = false
use_so_reuseport = false

[database]
num_databases = 16
num_shards = 16

[logging]
level = "debug"
file = "astradb.log"
async = false
queue_size = 8192

[performance]
enable_pipeline = true
enable_compression = false

[async]
use_async_commands = true

# Start in Redis-compatible mode for day-to-day development.
[storage]
mode = "redis"
enable_rocksdb_cold_data = true
enable_compression = true
compression_type = "zlib"

[storage.redis_mode]
rdb_enabled = true
rdb_path = "./data/dump.rdb"
rdb_auto_save = false
rdb_save_interval = 300
aof_enabled = true
aof_path = "./data/aof/appendonly.aof"
aof_sync_everysec = true

[storage.rocksdb_mode]
data_dir = "./data/rocksdb"
cache_size = 268435456
write_buffer_size = 67108864
enable_wal = true
create_if_missing = true
max_open_files = -1
max_total_wal_size = 104857600

[rocksdb]
enabled = true
data_dir = "./data/rocksdb-cold"
enable_wal = true
cache_size = 268435456
create_if_missing = true

[aof]
enabled = true
path = "./data/aof/appendonly.aof"
sync_everysec = true

[rdb]
enabled = true
path = "./data/dump.rdb"
auto_save = false
save_interval = 300

[persistence]
enabled = false
data_dir = "./data/astradb"
write_buffer_size = 4194304
cache_size = 268435456
sync_writes = false

[metrics]
enabled = true
bind_addr = "0.0.0.0"
port = 9100
stats_frequency_seconds = 10

[cluster]
enabled = false
node_id = ""
bind_addr = "0.0.0.0"
gossip_port = 7946
shard_count = 256
use_tcp = false
seeds = []

[memory]
max_memory = 1048576
eviction_policy = "2q"
eviction_threshold = 0.9
eviction_samples = 5
enable_tracking = true

[replication]
enabled = false
role = "master"
master_host = "127.0.0.1"
master_port = 6379
master_auth = ""
read_only = false
repl_backlog_size = 1048576
repl_timeout = 60

[acl]
enabled = false
default_user = "default"
default_password = ""
